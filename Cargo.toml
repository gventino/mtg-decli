[package]
name = "mtg-deck-builder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
image = "0.25.10"
ratatui = "0.30.1"
ratatui-image = { version = "11.0.4", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
